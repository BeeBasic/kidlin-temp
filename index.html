<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIDLIN School of AI — Something Special is Cooking</title>
  <meta name="description" content="KIDLIN School of AI is cooking something extraordinary. Live AI workshops for students and professionals — launching soon." />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-192.png" />

  <!-- Open Graph -->
  <meta property="og:title" content="KIDLIN School of AI — Coming Soon" />
  <meta property="og:description" content="We're cooking something special. Live AI workshops for real life — launching soon." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kidlinschool.ai" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Corben:wght@700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-wrapper" id="page-wrapper">

    <!-- Floating particles (decorative) -->
    <div class="particles" aria-hidden="true">
      <span class="particle p1"></span>
      <span class="particle p2"></span>
      <span class="particle p3"></span>
      <span class="particle p4"></span>
      <span class="particle p5"></span>
      <span class="particle p6"></span>
    </div>

    <!-- Main content -->
    <main class="hero" id="hero">

      <!-- Logo -->
      <div class="logo-container" id="logo-container">
        <img
          src="KIDLIN1.png"
          alt="KIDLIN School of AI"
          class="logo-img"
          id="logo-img"
          width="200"
          height="auto"
        />
      </div>

      <!-- Cooking animation -->
      <div class="cooking-scene" id="cooking-scene" aria-hidden="true">
        <div class="pot">
          <div class="pot-body">
            <div class="pot-shine"></div>
          </div>
          <div class="pot-rim"></div>
          <div class="pot-handle pot-handle-left"></div>
          <div class="pot-handle pot-handle-right"></div>
          <div class="lid">
            <div class="lid-knob"></div>
            <div class="lid-body"></div>
          </div>
          <!-- Steam columns -->
          <div class="steam-container">
            <div class="steam steam-1">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="steam steam-2">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="steam steam-3">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="headline" id="headline">
        We're cooking something <span class="highlight">special</span>
      </h1>

      <!-- Sub text -->
      <p class="subtext" id="subtext">
        KIDLIN School of AI is preparing an extraordinary learning experience.<br />
        Live AI workshops for real life — launching soon.
      </p>

      <!-- Divider -->
      <div class="divider" id="divider">
        <span class="divider-dot"></span>
        <span class="divider-line"></span>
        <span class="divider-dot"></span>
      </div>

      <!-- CTA -->
      <div class="cta-section" id="cta-section">
        <p class="cta-label">Have questions? Reach out to us</p>
        <a href="mailto:support@kidlinschool.ai" class="cta-btn" id="cta-email">
          <svg class="cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3" />
            <polyline points="22,5 12,13 2,5" />
          </svg>
          support@kidlinschool.ai
        </a>
      </div>

      <!-- Footer -->
      <footer class="footer" id="footer">
        <p>&copy; 2026 KIDLIN School of AI. All rights reserved.</p>
      </footer>

    </main>
  </div>
</body>
</html>
